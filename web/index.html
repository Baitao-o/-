<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麦门省钱搭子 · 按结构出最低价</title>
<style>
  :root{
    --red:#DA291C; --red-dark:#b31f14; --yellow:#FFC72C; --yellow-soft:#FFF4CC;
    --ink:#1a1a1a; --muted:#6b7280; --line:#e8e8ec; --bg:#f6f6f8; --card:#ffffff;
    --green:#0f9d58; --amber:#c77700;
    --radius:16px; --shadow:0 2px 8px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.6; -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{max-width:960px;margin:0 auto;padding:24px 16px 64px}

  /* ---------- 头部 ---------- */
  header{text-align:center;padding:20px 0 28px}
  .logo{
    display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:600;
    color:var(--red);background:var(--yellow-soft);padding:6px 14px;border-radius:999px;
    letter-spacing:.4px;
  }
  h1{font-size:30px;font-weight:800;margin:14px 0 8px;letter-spacing:-.5px}
  h1 .hl{color:var(--red)}
  .sub{color:var(--muted);font-size:14px;max-width:520px;margin:0 auto}

  /* ---------- 卡片 ---------- */
  .card{
    background:var(--card);border-radius:var(--radius);padding:22px;
    box-shadow:var(--shadow);border:1px solid var(--line);margin-bottom:18px;
  }
  .card h2{font-size:15px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
  .card h2::before{content:"";width:4px;height:15px;border-radius:2px;background:var(--red)}

  /* ---------- 表单 ---------- */
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .field{flex:1 1 180px;min-width:0}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
  input[type=number],input[type=text]{
    width:100%;padding:11px 13px;font-size:15px;border:1.5px solid var(--line);
    border-radius:10px;background:#fbfbfc;color:var(--ink);transition:.15s;font-family:inherit;
  }
  input:focus{outline:none;border-color:var(--red);background:#fff;box-shadow:0 0 0 3px rgba(218,41,28,.08)}
  .budget-input{font-size:22px !important;font-weight:800;letter-spacing:-.5px}

  /* 分段控件 */
  .seg{display:flex;background:#f0f0f4;border-radius:10px;padding:3px;gap:2px}
  .seg button{
    flex:1;padding:9px 8px;border:none;background:transparent;border-radius:8px;
    font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:.15s;font-family:inherit;
  }
  .seg button.on{background:#fff;color:var(--red);box-shadow:0 1px 3px rgba(0,0,0,.1)}

  /* 结构步进器 */
  .struct-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:4px}
  .stp{
    border:1.5px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center;
    background:#fbfbfc;transition:.15s;
  }
  .stp.active{border-color:var(--red);background:var(--yellow-soft)}
  .stp .ico{font-size:22px;line-height:1.2}
  .stp .nm{font-size:12px;font-weight:600;color:var(--muted);margin:2px 0 8px}
  .stp.active .nm{color:var(--red-dark)}
  .ctrl{display:flex;align-items:center;justify-content:center;gap:6px}
  .ctrl button{
    width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);background:#fff;
    font-size:15px;font-weight:700;color:var(--muted);cursor:pointer;line-height:1;
    display:flex;align-items:center;justify-content:center;transition:.12s;font-family:inherit;
  }
  .ctrl button:hover:not(:disabled){border-color:var(--red);color:var(--red)}
  .ctrl button:disabled{opacity:.35;cursor:not-allowed}
  .ctrl .val{font-size:17px;font-weight:800;min-width:20px;font-variant-numeric:tabular-nums}

  /* 复选 */
  .checks{display:flex;gap:18px;flex-wrap:wrap;margin-top:4px}
  .chk{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
  .chk input{width:16px;height:16px;accent-color:var(--red);cursor:pointer}

  /* 主按钮 */
  .submit{
    width:100%;padding:15px;margin-top:20px;border:none;border-radius:12px;
    background:linear-gradient(135deg,var(--red),var(--red-dark));color:#fff;
    font-size:16px;font-weight:700;cursor:pointer;transition:.18s;font-family:inherit;
    box-shadow:0 4px 14px rgba(218,41,28,.28);display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .submit:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 18px rgba(218,41,28,.34)}
  .submit:disabled{opacity:.6;cursor:not-allowed;transform:none}

  /* ---------- 状态 ---------- */
  .status{display:none;padding:16px;border-radius:12px;font-size:14px;margin-bottom:18px}
  .status.show{display:flex;align-items:center;gap:12px}
  .status.loading{background:#fff;border:1px solid var(--line);color:var(--muted)}
  .status.error{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c}
  .spin{
    width:18px;height:18px;border:2.5px solid var(--line);border-top-color:var(--red);
    border-radius:50%;animation:sp .7s linear infinite;flex-shrink:0;
  }
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ---------- 结果 ---------- */
  .result{display:none}
  .result.show{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .store-head{
    display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
    padding-bottom:14px;border-bottom:1px dashed var(--line);margin-bottom:16px;
  }
  .store-head .nm{font-size:16px;font-weight:700}
  .store-head .meta{font-size:12px;color:var(--muted);margin-top:2px}
  .badge{
    font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;flex-shrink:0;
  }
  .badge.ok{background:#e8f5e9;color:var(--green)}
  .badge.warn{background:#fff7ed;color:var(--amber)}

  /* 结构行 */
  .slot-row{
    display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #f2f2f5;
  }
  .slot-row:last-of-type{border-bottom:none}
  .slot-tag{
    flex-shrink:0;width:60px;font-size:11px;font-weight:700;color:var(--red);
    background:var(--yellow-soft);padding:4px 0;border-radius:7px;text-align:center;
  }
  .slot-info{flex:1;min-width:0}
  .slot-info .n{font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .slot-info .q{font-size:12px;color:var(--muted)}
  .slot-price{text-align:right;flex-shrink:0}
  .slot-price .p{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
  .slot-price .u{font-size:11px;color:var(--muted)}

  /* 合计 */
  .total-box{
    background:linear-gradient(135deg,#fff8e6,#fffdf5);border:1.5px solid #ffe9a8;
    border-radius:12px;padding:16px;margin-top:16px;
  }
  .total-line{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .total-line .lb{font-size:13px;font-weight:600;color:var(--muted)}
  .total-line .big{font-size:30px;font-weight:800;color:var(--red);letter-spacing:-1px;font-variant-numeric:tabular-nums}
  .sub-line{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:8px;gap:10px}
  .sub-line b{color:var(--ink);font-variant-numeric:tabular-nums}

  /* 预算进度条 */
  .bar{height:7px;background:#eee;border-radius:999px;overflow:hidden;margin-top:14px}
  .bar span{display:block;height:100%;border-radius:999px;transition:width .5s ease}
  .bar.ok span{background:linear-gradient(90deg,#34c759,#0f9d58)}
  .bar.over span{background:linear-gradient(90deg,#f59e0b,#da291c)}
  .bar-note{font-size:12px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between}

  .breakdown{
    margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);
    font-size:13px;color:var(--muted);
  }
  .breakdown b{color:var(--ink)}
  /* MCP Token 配置引导条 */
  .cfg-bar{margin-bottom:18px;padding:14px 16px;border-radius:12px;font-size:13px;line-height:1.75}
  .cfg-bar.ok{background:#f2fbf5;border:1px solid #c8ecd4;color:#0f7b46;
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px}
  .cfg-bar.warn{background:#fff7ed;border:1px solid #fed7aa;color:#9a4a05}
  .cfg-bar a{color:inherit;text-decoration:underline;font-weight:600}
  .cfg-src{font-size:12px;opacity:.85}
  .cfg-inp{flex:1;min-width:210px;padding:10px 12px;border:1.5px solid #e8c9a6;
    border-radius:9px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink)}
  .cfg-inp:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(218,41,28,.08)}
  .cfg-save{padding:10px 20px;border:none;border-radius:9px;background:linear-gradient(135deg,var(--red),var(--red-dark));
    color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;flex-shrink:0}
  .cfg-save:hover:not(:disabled){transform:translateY(-1px)}
  .cfg-save:disabled{opacity:.6;cursor:not-allowed}
  .notice{font-size:11.5px;color:#9ca3af;margin-top:16px;line-height:1.6}

  /* 想吃偏好诊断提示 */
  .want-diag{margin-top:14px;display:flex;flex-direction:column;gap:8px}
  .wd-item{
    display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.6;
    padding:10px 12px;border-radius:10px;
  }
  .wd-item .ico{flex-shrink:0;font-size:14px}
  .wd-notfound{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c}
  .wd-excluded{background:#fff7ed;border:1px solid #fed7aa;color:#b45309}
  .wd-found{background:#f4f7fb;border:1px solid #e2e8f0;color:#556}

  /* 多方案（预算模式） */
  .plan-card{
    border:1.5px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;background:#fbfbfc;
  }
  .plan-card:first-of-type{border-color:var(--yellow);background:#fffdf7}
  .plan-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .plan-title .t{font-size:14px;font-weight:700}
  .plan-title .amt{font-size:19px;font-weight:800;color:var(--red);font-variant-numeric:tabular-nums}
  .plan-items{font-size:13px;color:var(--muted);line-height:1.9}
  .plan-items div{display:flex;justify-content:space-between;gap:10px}
  .plan-items span:last-child{font-variant-numeric:tabular-nums;color:var(--ink)}

  /* 免责 */
  footer{text-align:center;font-size:11.5px;color:#9ca3af;margin-top:28px;line-height:1.8}


  /* ---------- 美食转盘 ---------- */
  .wheel-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:4px}
  .wheel-card{
    border:1.5px solid var(--line);border-radius:14px;padding:14px 12px;background:#fbfbfc;
    text-align:center;transition:.2s;
  }
  .wheel-card.spinning{border-color:var(--yellow);background:#fffdf6}
  .wheel-card.locked{border-color:var(--green);background:#f2fbf5}
  .wc-head{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:700;margin-bottom:10px}
  .wheel-wrap{position:relative;width:100%;max-width:190px;margin:0 auto;aspect-ratio:1}
  .wheel{
    width:100%;height:100%;border-radius:50%;position:relative;overflow:hidden;
    border:5px solid #fff;box-shadow:0 0 0 2px #ececf0, inset 0 0 0 1px rgba(0,0,0,.04), 0 6px 16px rgba(16,24,40,.10);
    transition:transform 2.9s cubic-bezier(.16,.84,.28,1);
    will-change:transform;
  }
  .wheel-disc{width:100%;height:100%;border-radius:50%}
  .wheel-hub{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:44%;height:44%;border-radius:50%;background:#fff;
    box-shadow:0 2px 8px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:700;color:var(--red);padding:6px;line-height:1.2;overflow:hidden;
    text-align:center;z-index:2;
  }
  .wheel-pointer{
    position:absolute;left:50%;top:-9px;transform:translateX(-50%);
    width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;
    border-top:15px solid var(--red);z-index:4;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));
  }
  .wheel-card.idle .wheel-pointer{animation:bob 1.6s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(4px)}}
  .wc-result{
    margin-top:10px;font-size:13px;font-weight:700;color:var(--ink);min-height:20px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .wc-result .pr{color:var(--muted);font-weight:600;font-size:11px;margin-left:4px}
  .wc-actions{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px}
  .wc-spin{
    padding:7px 18px;border:none;border-radius:9px;cursor:pointer;font-family:inherit;
    background:linear-gradient(135deg,var(--red),var(--red-dark));color:#fff;font-size:13px;font-weight:700;
    box-shadow:0 3px 10px rgba(218,41,28,.26);transition:.15s;
  }
  .wc-spin:hover:not(:disabled){transform:translateY(-1px)}
  .wc-spin:disabled{opacity:.5;cursor:not-allowed}
  .wc-lock{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);cursor:pointer;user-select:none}
  .wc-lock input{width:14px;height:14px;accent-color:var(--green);cursor:pointer}
  .wheel-toolbar{display:flex;gap:12px;margin-top:18px}
  .wheel-toolbar button{flex:1}
  .btn-secondary{
    padding:14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);
    font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;
  }
  .btn-secondary:hover:not(:disabled){border-color:var(--red);color:var(--red)}
  .btn-secondary:disabled{opacity:.5;cursor:not-allowed}
  .settle-card{margin-top:16px}

  @media(max-width:560px){
    .wheel-grid{grid-template-columns:repeat(2,1fr);gap:10px}
    .wheel-card{padding:10px 8px}
    .wheel-wrap{max-width:130px}
    .wc-spin{padding:6px 12px;font-size:12px}
  }

  @media(max-width:640px){
    h1{font-size:24px}
    .wrap{padding:16px 12px 48px}
    .card{padding:16px;border-radius:14px}
    .struct-grid{grid-template-columns:repeat(2,1fr)}
    .total-line .big{font-size:26px}
    .row{gap:10px}
    .field{flex:1 1 100%}
  }
</style>
<!-- 转盘视觉与动效增强包（WorkBuddy WB-6 产出，仅作用于 #wheelSection 内的转盘元素） -->
<link rel="stylesheet" href="wheel-theme.css">
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo">🍔 麦当劳 MCP · 用餐赛道</div>
    <h1>麦门<span class="hl">省钱搭子</span></h1>
    <p class="sub">给一个预算，再定下主食、小吃、甜品、饮品各要几份 —— 它去真实菜单里挑出<strong>这个结构下最便宜</strong>的组合。</p>
  </header>

  <!-- MCP Token 配置引导 -->
  <div id="cfgBar" class="cfg-bar" style="display:none"></div>

  <!-- 表单 -->
  <div class="card">
    <h2>告诉我你的需求</h2>

    <div class="row">
      <div class="field">
        <label>预算（元）</label>
        <input class="budget-input" type="number" id="budget" value="100" min="1" step="5">
      </div>
      <div class="field">
        <label>用餐人数</label>
        <input type="number" id="people" value="2" min="1" max="20">
      </div>
      <div class="field">
        <label>取餐方式</label>
        <div class="seg" id="modeSeg">
          <button class="on" data-mode="pickup">到店自取</button>
          <button data-mode="delivery">麦乐送</button>
        </div>
      </div>
    </div>

    <div class="row" style="margin-top:14px" id="storeRow">
      <div class="field">
        <label>城市</label>
        <input type="text" id="city" value="绍兴" placeholder="如：绍兴">
      </div>
      <div class="field">
        <label>位置关键词</label>
        <input type="text" id="keyword" value="上虞" placeholder="如：上虞 / 国贸">
      </div>
    </div>

    <div style="margin-top:18px">
      <div class="seg" id="planModeSeg" style="margin-bottom:14px">
        <button class="on" data-pmode="structure">按结构配 · 求最低价</button>
        <button data-pmode="budget">帮我搭配 · 推荐方案</button>
        <button data-pmode="wheel">🎰 美食转盘 · 随机抽</button>
      </div>
      <label id="structLabel" style="display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:8px">
        餐品结构（各要几份，0 表示不要）
      </label>
      <div class="struct-grid" id="structGrid">
        <div class="stp active" data-key="main">
          <div class="ico">🍔</div><div class="nm">主食</div>
          <div class="ctrl"><button data-d="-1" disabled>−</button><span class="val">1</span><button data-d="1">+</button></div>
        </div>
        <div class="stp active" data-key="snack">
          <div class="ico">🍟</div><div class="nm">小吃</div>
          <div class="ctrl"><button data-d="-1" disabled>−</button><span class="val">1</span><button data-d="1">+</button></div>
        </div>
        <div class="stp active" data-key="dessert">
          <div class="ico">🍦</div><div class="nm">甜品</div>
          <div class="ctrl"><button data-d="-1" disabled>−</button><span class="val">1</span><button data-d="1">+</button></div>
        </div>
        <div class="stp active" data-key="drink">
          <div class="ico">🥤</div><div class="nm">饮品</div>
          <div class="ctrl"><button data-d="-1" disabled>−</button><span class="val">1</span><button data-d="1">+</button></div>
        </div>
      </div>
    </div>

    <div class="row" style="margin-top:16px">
      <div class="field">
        <label>想吃（逗号分隔，会优先出现）</label>
        <input type="text" id="want" placeholder="如：鸡翅,甜品">
      </div>
      <div class="field">
        <label>忌口（逗号分隔，会直接排除）</label>
        <input type="text" id="avoid" placeholder="如：牛肉,香菜">
      </div>
      <div class="field" style="flex:0 0 auto;align-self:flex-end;padding-bottom:11px">
        <div class="checks">
          <label class="chk"><input type="checkbox" id="perPerson"> 每人一份</label>
          <label class="chk"><input type="checkbox" id="noSpicy"> 不吃辣</label>
        </div>
      </div>
    </div>

    <button class="submit" id="go"><span>🍔</span> 给我这个结构的最低价</button>
  </div>

  <!-- 美食转盘 -->
  <div class="card" id="wheelSection" style="display:none">
    <h2>运气点餐 · 四个盘各转一格</h2>
    <p style="font-size:13px;color:var(--muted);margin:-6px 0 16px">
      候选全部来自该门店实时菜单，按你的预算均分到四类。抽中后点「结算」会用真实算价告诉你到底多少钱。
    </p>
    <div class="wheel-grid" id="wheelGrid"></div>
    <div class="wheel-toolbar">
      <button class="btn-secondary" id="spinAll" disabled>🎰 全部转起来</button>
      <button class="btn-secondary" id="settleBtn" disabled>✅ 就这个，算真实价格</button>
    </div>
  </div>

  <!-- 结算结果 -->
  <div class="result" id="settleResult"></div>

  <!-- 状态 -->
  <div class="status" id="status"></div>

  <!-- 结果 -->
  <div class="result" id="result"></div>

  <footer>
    价格与可售状态来自麦当劳 MCP 实时返回，最终以下单页面为准。<br>
    本作品为赛事参赛作品，非麦当劳官方产品。MCP Token 仅存于本地环境变量，不写入页面与仓库。
  </footer>
</div>

<script>
(function(){
  "use strict";

  const $ = (s) => document.querySelector(s);
  const $$ = (s) => Array.prototype.slice.call(document.querySelectorAll(s));

  const state = {
    mode: "pickup",
    planMode: "structure",   // structure = 按结构求最低价；budget = 帮我搭配
    struct: { main: 1, snack: 1, dessert: 1, drink: 1 },
  };

  const SLOT_ORDER = ["main", "snack", "dessert", "drink"];
  const SLOT_ICON = { main: "🍔", snack: "🍟", dessert: "🍦", drink: "🥤", other: "🛍️" };

  // ---------- 取餐方式切换 ----------
  $$("#modeSeg button").forEach(function(btn){
    btn.addEventListener("click", function(){
      $$("#modeSeg button").forEach(function(b){ b.classList.remove("on"); });
      btn.classList.add("on");
      state.mode = btn.dataset.mode;
      $("#storeRow").style.display = state.mode === "pickup" ? "flex" : "none";
    });
  });

  // ---------- 规划模式切换（按结构 / 帮我搭配）----------
  $$("#planModeSeg button").forEach(function(btn){
    btn.addEventListener("click", function(){
      $$("#planModeSeg button").forEach(function(b){ b.classList.remove("on"); });
      btn.classList.add("on");
      state.planMode = btn.dataset.pmode;
      var showStruct = state.planMode === "structure";
      var isWheel = state.planMode === "wheel";
      $("#structGrid").style.display = showStruct ? "grid" : "none";
      $("#structLabel").style.display = showStruct ? "block" : "none";

        $("#go").innerHTML = '<span>🍔</span> 给我这个结构的最低价';
      } else {
        $("#go").innerHTML = '<span>🎲</span> 帮我搭配几个方案';
      }
    });
  });

  // ---------- 结构步进器 ----------
  $$("#structGrid .stp").forEach(function(box){
    const key = box.dataset.key;
    const valEl = box.querySelector(".val");
    const minus = box.querySelector('[data-d="-1"]');
    const plus = box.querySelector('[data-d="1"]');

    function render(){
      const v = state.struct[key];
      valEl.textContent = v;
      minus.disabled = v <= 0;
      box.classList.toggle("active", v > 0);
    }
    minus.addEventListener("click", function(){
      state.struct[key] = Math.max(0, state.struct[key] - 1); render();
    });
    plus.addEventListener("click", function(){
      state.struct[key] = Math.min(9, state.struct[key] + 1); render();
    });
    render();
  });

  // ---------- UI 状态 ----------
  function setStatus(kind, text){
    const el = $("#status");
    if (!kind){
      el.className = "status"; el.innerHTML = ""; return;
    }
    el.className = "status show " + kind;
    el.innerHTML = kind === "loading"
      ? '<div class="spin"></div><div>' + text + '</div>'
      : '<div>⚠️</div><div>' + text + '</div>';
  }

  function money(n){
    if (n === null || n === undefined) return "—";
    return "¥" + Number(n).toFixed(2);
  }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }

  // ---------- 渲染：结构模式 ----------
  function renderStructure(data){
    const best = data.best;
    const budget = data.request.budget;
    const total = best.verifiedTotal !== null ? best.verifiedTotal : best.subtotal;
    const used = Math.min(100, (total / budget) * 100);
    const ok = data.feasible;

    const grouped = {};
    (best.items || []).forEach(function(it){
      const slot = it.slot || "other";
      (grouped[slot] = grouped[slot] || []).push(it);
    });

    let rows = "";
    SLOT_ORDER.concat(["other"]).forEach(function(slot){
      (grouped[slot] || []).forEach(function(it){
        rows += '<div class="slot-row">'
          + '<div class="slot-tag">' + SLOT_ICON[slot] + " " + esc(it.slotLabel) + " " + it.quantity + "份</div>"
          + '<div class="slot-info"><div class="n">' + esc(it.name) + '</div>'
          + '<div class="q">' + esc(it.category) + " · 单价 " + money(it.unitPrice) + (it.quantity > 1 ? " × " + it.quantity : "") + '</div></div>'
          + '<div class="slot-price"><div class="p">' + money(it.subtotal) + '</div><div class="u">小计</div></div>'
          + '</div>';
      });
    });

    let breakdownHtml = "";
    if (best.breakdown){
      const b = best.breakdown, parts = ['商品 ' + money(b.product)];
      if (b.delivery) parts.push('配送 ' + money(b.delivery));
      if (b.packing) parts.push('打包 ' + money(b.packing));
      if (b.discount) parts.push('优惠 −' + money(b.discount));
      breakdownHtml = '<div class="breakdown">费用拆分：<b>' + parts.join(" + ") + '</b></div>';
    }

    const remainTxt = ok
      ? "预算内还余 " + money(data.remaining)
      : "超出预算 " + money(-data.remaining);

    $("#result").innerHTML =
      '<div class="card">'
      + '<div class="store-head">'
      +   '<div><div class="nm">' + esc(data.store.name) + '</div>'
      +     '<div class="meta">' + esc(data.request.mode === "pickup" ? "到店自取" : "麦乐送")
      +     ' · 门店 ' + esc(data.store.storeCode)
      +     (data.store.businessStatus === false ? ' · <span style="color:#c77700">当前非营业时段</span>' : "")
      +     ' · ' + data.itemPoolSize + ' 个可售商品</div></div>'
      +   '<div class="badge ' + (ok ? "ok" : "warn") + '">' + (ok ? "✓ 预算内" : "⚠ 超预算") + '</div>'
      + '</div>'
      + rows
      + '<div class="total-box">'
      +   '<div class="total-line"><span class="lb">' + (ok ? "该结构最低价 · 实付" : "该结构最低价 · 仍需") + '</span>'
      +     '<span class="big">' + money(total) + '</span></div>'
      +   '<div class="bar ' + (ok ? "ok" : "over") + '"><span style="width:' + used + '%"></span></div>'
      +   '<div class="bar-note"><span>预算 ' + money(budget) + '</span><span>' + remainTxt + '</span></div>'
      +   breakdownHtml
      + '</div>'
      + (best.reason ? '<div class="breakdown" style="border-top:none;padding-top:10px">' + esc(best.reason) + '</div>' : '')
      + wantDiagHtml(data)
      + '<div class="notice">' + esc(data.notice) + '</div>'
      + '</div>';
    $("#result").classList.add("show");
  }

  // ---------- 渲染：预算模式（多方案） ----------
  function renderBudget(data){
    let html = '<div class="card">'
      + '<div class="store-head"><div><div class="nm">' + esc(data.store.name) + '</div>'
      + '<div class="meta">' + esc(data.request.mode === "pickup" ? "到店自取" : "麦乐送")
      + ' · 门店 ' + esc(data.store.storeCode) + ' · ' + data.itemPoolSize + ' 个可售商品</div></div>'
      + '<div class="badge ' + (data.feasible ? "ok" : "warn") + '">'

    data.plans.forEach(function(p, i){
      const total = p.verifiedTotal !== null ? p.verifiedTotal : p.subtotal;
      let items = "";
      (p.items || []).forEach(function(it){

    $("#result").classList.add("show");

  // ---------- 渲染：预算内配不齐（如实给最低所需，不硬凑） ----------
  function renderInfeasible(data){
    const req = data.request || {};
    const budget = req.budget || 0;
    const min = data.minimumNeeded;
    const gap = data.gap;

    var structDesc = "";
    Object.keys(data.structure || {}).forEach(function(k){
      if (data.structure[k] > 0) {
        structDesc += (SLOT_ICON[k] || "") + " " + (data.structure[k]) + " 份　";
      }
    });

    var advice = "";
    if (min) {
      advice = '<div class="total-box" style="border-color:#fed7aa;background:linear-gradient(135deg,#fff7ed,#fffdfa)">'
        + '<div class="total-line"><span class="lb">这个结构的最低所需</span>'
        + '<span class="big" style="color:#c77700">' + money(min) + '</span></div>'
        + '<div class="bar-note"><span>你的预算 ' + money(budget) + '</span>'

        + '</div>';

      '<div class="card">'
      + '<div class="store-head"><div><div class="nm">' + esc(data.store.name) + '</div>'
      + '<div class="meta">门店 ' + esc(data.store.storeCode) + ' · '
      + (data.itemPoolSize || 0) + ' 个可售商品</div></div>'
      + '<div class="badge warn">⚠ 配不齐</div></div>'
      + '<div style="font-size:14px;line-height:1.9">'
      +   '你要的结构：' + structDesc + '<br>'
      +   esc(data.error || "该结构在当前门店无法用这个预算配齐")
      + '</div>'
      + advice
      + wantDiagHtml(data)
      + '<div class="breakdown">建议：把预算提到 ' + (min ? money(min) : "更高")
      + ' 以上；或减少份数（例如先去掉甜品 / 饮品）；也可以换一家门店看看。</div>'
      + '<div class="notice">' + esc(data.notice) + '</div>'
      + '</div>';
    $("#result").classList.add("show");
  }

  // ---------- 想吃偏好诊断（菜单没有 / 被忌口排除 / 有可选）----------
  function wantDiagHtml(data){
    const diag = data.wantDiagnosis || {};
    const keys = Object.keys(diag);
    if (!keys.length) return "";
    let html = '<div class="want-diag">';
    keys.forEach(function(w){
      const d = diag[w] || {};
      if (d.status === "not_found"){
        html += '<div class="wd-item wd-notfound"><span class="ico">🚫</span><div>'
          + '<b>本店菜单里没有「' + esc(w) + '」</b><br>'
          + '这个偏好无法满足，<b>不是预算问题</b>，不用再提高预算。可以换个商品名或换一家门店。</div></div>';
      } else if (d.status === "excluded"){
        html += '<div class="wd-item wd-excluded"><span class="ico">⚠️</span><div>'
          + '<b>「' + esc(w) + '」被排除了</b><br>' + esc(d.reason || "")
          + (d.candidates && d.candidates.length
             ? '<br>相关商品：' + esc(d.candidates.join("、")) : "")
          + '</div></div>';
      } else if (d.status === "found"){
        html += '<div class="wd-item wd-found"><span class="ico">ℹ️</span><div>'
          + '「' + esc(w) + '」本店有 ' + (d.matchCount || 0) + ' 个可选'
          + (d.candidates && d.candidates.length
             ? '（如 ' + esc(d.candidates.slice(0,4).join("、")) + '）' : "")
          + '</div></div>';
      }
    });
    html += '</div>';
    return html;
  }

  // ---------- MCP Token 配置引导 ----------
  async function checkConfig(){
    try {
      const res = await fetch("/api/config", { cache: "no-store" });
      const d = await res.json();
      if (d && d.ok) renderCfgBar(d);
    } catch (e) { /* 配置查询失败不阻塞主流程 */ }
  }

  function cfgFormHtml(d, isChange){
    const title = isChange ? "更换 MCP Token" : "还没有配置麦当劳 MCP Token，查询会失败";
    const io = isChange && d && d.masked
      ? '<div style="font-size:12.5px;margin-bottom:10px">当前：' + esc(d.masked) + '　新的会覆盖旧的，只存在本机。</div>'
      : '<div style="font-size:12.5px;margin-bottom:12px">'
        + '① 打开 <a href="' + (d && d.applyUrl ? d.applyUrl : "https://open.mcd.cn/mcp") + '" target="_blank" rel="noopener">open.mcd.cn/mcp</a>'
        + '，手机号登录 → 控制台 → 激活 → 申请 Token<br>'
        + '② 粘贴到下面点保存。Token 只写进你这台机器的配置文件，不会上传、不会进 git。</div>';
    return '<div style="font-weight:700;margin-bottom:8px">' + esc(title) + '</div>'
      + io
      + '<div style="display:flex;gap:8px;flex-wrap:wrap">'
      + '<input type="text" id="cfgToken" class="cfg-inp" placeholder="粘贴你的 MCP Token" autocomplete="off">'
      + '<button id="cfgSave" class="cfg-save">保存</button>'
      + (isChange ? '<button id="cfgCancel" class="cfg-save" style="background:#fff;color:#9a4a05;border:1.5px solid #fed7aa">取消</button>' : '')
      + '</div>';
  }

  function renderCfgBar(d){
    const el = $("#cfgBar");
    el.style.display = "block";
    if (d.configured){
      el.className = "cfg-bar ok";
      el.innerHTML = '<span>✅ 麦当劳 MCP 已配置</span>'
        + '<span class="cfg-src">' + esc(d.sourceHint || "") + (d.masked ? " · " + esc(d.masked) : "") + '</span>'
        + '<a href="#" id="cfgChange">更换</a>';
      const chg = $("#cfgChange");
      if (chg) chg.addEventListener("click", function(e){
        e.preventDefault();
        showCfgForm(d, true);
      });
    } else {
      showCfgForm(d, false);
    }
  }

  function showCfgForm(d, isChange){
    const el = $("#cfgBar");
    el.className = "cfg-bar warn";
    el.style.display = "block";
    el.innerHTML = cfgFormHtml(d, isChange);
    const save = $("#cfgSave");
    const cancel = $("#cfgCancel");
    if (save) save.addEventListener("click", saveCfgToken);
    if (cancel) cancel.addEventListener("click", function(){ checkConfig(); });
    const inp = $("#cfgToken");
    if (inp){
      inp.focus();
      inp.addEventListener("keydown", function(e){ if (e.key === "Enter") saveCfgToken(); });
    }
  }

  async function saveCfgToken(){
    const inp = $("#cfgToken");
    const token = inp ? inp.value.trim() : "";
    if (!token){ setStatus("error", "请先粘贴 MCP Token"); return; }
    const btn = $("#cfgSave");
    if (btn){ btn.disabled = true; btn.textContent = "保存中…"; }
    try {
      const res = await fetch("/api/config", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: token })
      });
      const d = await res.json();
      if (!res.ok || !d.ok) throw new Error(d.error || ("保存失败 " + res.status));
      setStatus(null);
      renderCfgBar({
        configured: true,
        sourceHint: "来自本机配置文件，仅你自己可见",
        masked: d.masked,
        applyUrl: "https://open.mcd.cn/mcp"
      });
    } catch (e) {
      setStatus("error", e.message || String(e));
      if (btn){ btn.disabled = false; btn.textContent = "保存"; }
    }
  }

  // 页面加载即检查一次配置状态
  checkConfig();

  // ---------- 美食转盘 ----------
  const WHEEL_SLOTS = [
    { key: "main",    label: "主食", icon: "🍔" },
    { key: "snack",   label: "小吃", icon: "🍟" },
    { key: "dessert", label: "甜品", icon: "🍦" },
    { key: "drink",   label: "饮品", icon: "🥤" }
  ];
  const WHEEL_COLORS = ["#DA291C","#FFC72C","#E8563F","#F5A623","#C42418","#FFD65C","#D9534F","#FFE08A"];
  const WHEEL_SPIN_MS = 2900;

  state.wheel = { pools: null, store: null, request: null,
                  results: {}, locked: {}, rotation: {}, spinning: {} };

  async function postJSON(path, payload, timeoutMs){
    const ctrl = new AbortController();
    const timer = setTimeout(function(){ ctrl.abort(); }, timeoutMs || 90000);
    try {
      const res = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
        signal: ctrl.signal
      });
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.error || ("请求失败 " + res.status));
      return data;
    } catch (err) {
      if (err.name === "AbortError") throw new Error("请求超时，请稍后重试");
      throw err;
    } finally {
      clearTimeout(timer);
    }
  }

  function buildWheels(){
    const grid = $("#wheelGrid");
    grid.innerHTML = "";
    WHEEL_SLOTS.forEach(function(sl){
      const card = document.createElement("div");
      card.className = "wheel-card idle";
      card.dataset.slot = sl.key;
      card.innerHTML =
        '<div class="wc-head"><span>' + sl.icon + '</span><span>' + sl.label + '</span></div>'
        + '<div class="wheel-wrap">'
        +   '<div class="wheel-pointer"></div>'
        +   '<div class="wheel"><div class="wheel-disc"></div><div class="wheel-hub">转一下</div></div>'
        + '</div>'
        + '<div class="wc-result">还没转</div>'
        + '<div class="wc-actions">'
        +   '<button class="wc-spin">转</button>'
        +   '<label class="wc-lock"><input type="checkbox"> 锁定</label>'
        + '</div>';
      grid.appendChild(card);

      const btn = card.querySelector(".wc-spin");
      const lock = card.querySelector(".wc-lock input");
      btn.addEventListener("click", function(){ spinSlot(sl.key); });
      lock.addEventListener("change", function(){
        state.wheel.locked[sl.key] = lock.checked;
        card.classList.toggle("locked", lock.checked);
        btn.disabled = lock.checked;
        updateWheelButtons();
      });

      state.wheel.rotation[sl.key] = 0;
      state.wheel.results[sl.key] = null;
      state.wheel.locked[sl.key] = false;
      state.wheel.spinning[sl.key] = false;
      card.querySelector(".wheel").style.transform = "rotate(0deg)";
    });
  }

  function paintWheel(slot){
    const pool = state.wheel.pools[slot] || [];
    const card = document.querySelector('.wheel-card[data-slot="' + slot + '"]');
    if (!card || !pool.length) return;
    const n = pool.length, seg = 360 / n, stops = [];
    for (let i = 0; i < n; i++){
      stops.push(WHEEL_COLORS[i % WHEEL_COLORS.length] + " " + (i * seg) + "deg " + ((i + 1) * seg) + "deg");
    }
    card.querySelector(".wheel-disc").style.background = "conic-gradient(" + stops.join(",") + ")";
  }

  function spinSlot(slot){
    const pool = state.wheel.pools[slot];
    if (!pool || !pool.length) return;
    if (state.wheel.locked[slot] || state.wheel.spinning[slot]) return;

    const card = document.querySelector('.wheel-card[data-slot="' + slot + '"]');
    const wheelEl = card.querySelector(".wheel");
    const hub = card.querySelector(".wheel-hub");
    const resEl = card.querySelector(".wc-result");
    const btn = card.querySelector(".wc-spin");

    state.wheel.spinning[slot] = true;
    card.classList.add("spinning");
    card.classList.remove("idle");
    btn.disabled = true;
    hub.textContent = "…";
    resEl.textContent = "转动中…";

    const n = pool.length, seg = 360 / n;
    const idx = Math.floor(Math.random() * n);
    const targetCenter = idx * seg + seg / 2;
    const cur = ((state.wheel.rotation[slot] % 360) + 360) % 360;
    const delta = (360 - targetCenter - cur + 360) % 360;
    state.wheel.rotation[slot] += 360 * 6 + delta;
    wheelEl.style.transform = "rotate(" + state.wheel.rotation[slot] + "deg)";

    setTimeout(function(){
      const it = pool[idx];
      state.wheel.results[slot] = it;
      state.wheel.spinning[slot] = false;
      card.classList.remove("spinning");
      if (!state.wheel.locked[slot]) btn.disabled = false;
      hub.textContent = "¥" + it.price;
      resEl.innerHTML = esc(it.name) + '<span class="pr">¥' + it.price + '</span>';
      updateWheelButtons();
    }, WHEEL_SPIN_MS);
  }

  function spinAll(){
    WHEEL_SLOTS.forEach(function(sl, i){
      if (state.wheel.locked[sl.key]) return;
      setTimeout(function(){ spinSlot(sl.key); }, i * 280);
    });
  }

  function updateWheelButtons(){
    const ready = WHEEL_SLOTS.every(function(sl){ return !!state.wheel.results[sl.key]; });
    $("#spinAll").disabled = !state.wheel.pools;
    $("#settleBtn").disabled = !ready;
  }

  async function runWheel(){
    const budget = Number($("#budget").value || 0);
    if (!(budget > 0)) { setStatus("error", "请填写大于 0 的预算"); return; }

    $("#go").disabled = true;
    $("#settleResult").classList.remove("show");
    setStatus("loading", "正在拉取该门店实时菜单，按预算生成四个转盘…（约 10 秒）");

    try {
      const data = await postJSON("/api/wheel/pool", {
        budget: budget,
        people: Number($("#people").value || 1),
        mode: state.mode,
        city: $("#city").value.trim(),
        keyword: $("#keyword").value.trim()
      });
      state.wheel.pools = data.pools;
      state.wheel.store = data.store;
      state.wheel.request = data.request;
      buildWheels();
      WHEEL_SLOTS.forEach(function(sl){ paintWheel(sl.key); });
      $("#wheelSection").style.display = "block";
      setStatus(null);
      updateWheelButtons();
      $("#wheelSection").scrollIntoView({ behavior: "smooth", block: "nearest" });
    } catch (err) {
      setStatus("error", err.message || String(err));
    } finally {
      $("#go").disabled = false;
    }
  }

  async function settleWheel(){
    const items = WHEEL_SLOTS.map(function(sl){
      const it = state.wheel.results[sl.key];
      return it ? { code: it.code, quantity: 1 } : null;
    }).filter(Boolean);
    if (items.length !== WHEEL_SLOTS.length) return;

    const btn = $("#settleBtn");
    const old = btn.textContent;
    btn.disabled = true;
    btn.textContent = "⏳ 正在真实算价…";
    try {
      const d = await postJSON("/api/wheel/settle", {
        storeCode: state.wheel.store.storeCode,
        beCode: state.wheel.store.beCode,
        mode: state.wheel.request.mode,
        items: items
      });
      renderSettle(d);
    } catch (err) {
      setStatus("error", err.message || String(err));
    } finally {
      btn.disabled = false;
      btn.textContent = old;
    }
  }

  function renderSettle(d){
    const budget = state.wheel.request.budget;
    const total = d.price;
    const ok = total <= budget;
    const used = Math.min(100, (total / budget) * 100);

    let rows = "";
    WHEEL_SLOTS.forEach(function(sl){
      const it = state.wheel.results[sl.key];
      if (!it) return;
      rows += '<div class="slot-row">'
        + '<div class="slot-tag">' + sl.icon + " " + sl.label + '</div>'
        + '<div class="slot-info"><div class="n">' + esc(it.name) + '</div>'
        + '<div class="q">菜单价 ¥' + it.price + '</div></div>'
        + '<div class="slot-price"><div class="p">¥' + it.price + '</div><div class="u">菜单价</div></div>'
        + '</div>';
    });

    const parts = ["商品 ¥" + d.productPrice];
    if (d.deliveryPrice) parts.push("配送 ¥" + d.deliveryPrice);
    if (d.packingPrice) parts.push("打包 ¥" + d.packingPrice);
    if (d.discount) parts.push("优惠 -¥" + d.discount);
    const bd = '<div class="breakdown">费用拆分：<b>' + parts.join(" + ") + '</b></div>';

    $("#settleResult").innerHTML =
      '<div class="card settle-card">'
      + '<div class="store-head"><div><div class="nm">🎰 你抽到的这一顿</div>'
      + '<div class="meta">' + esc(state.wheel.store.name) + ' · 门店 ' + esc(state.wheel.store.storeCode) + '</div></div>'
      + '<div class="badge ' + (ok ? "ok" : "warn") + '">' + (ok ? "✓ 预算内" : "⚠ 超预算") + '</div></div>'
      + rows
      + '<div class="total-box">'
      +   '<div class="total-line"><span class="lb">真实算价 · 实付</span><span class="big">¥' + total.toFixed(2) + '</span></div>'
      +   '<div class="bar ' + (ok ? "ok" : "over") + '"><span style="width:' + used + '%"></span></div>'
      +   '<div class="bar-note"><span>预算 ¥' + budget + '</span><span>' + (ok ? "还余 ¥" + (budget - total).toFixed(2) : "超 ¥" + (total - budget).toFixed(2)) + '</span></div>'
      +   bd
      + '</div>'
      + '<div class="notice">' + esc(d.notice) + '</div>'
      + '</div>';
    $("#settleResult").classList.add("show");
    $("#settleResult").scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  $("#spinAll").addEventListener("click", spinAll);
  $("#settleBtn").addEventListener("click", settleWheel);

  // ---------- 提交 ----------
  async function run(){
    if (state.planMode === "wheel") return runWheel();
    const budget = Number($("#budget").value || 0);
    if (!(budget > 0)) { setStatus("error", "请填写大于 0 的预算"); return; }

    const payload = {
      budget: budget,
      people: Number($("#people").value || 1),
      mode: state.mode,
      city: $("#city").value.trim(),
      keyword: $("#keyword").value.trim(),
      avoid: $("#avoid").value.trim(),
      want: $("#want").value.trim(),
      noSpicy: $("#noSpicy").checked,
      perPerson: $("#perPerson").checked,
      main: 0, snack: 0, dessert: 0, drink: 0,
    };
    if (state.planMode === "structure") {
      payload.main = state.struct.main;
      payload.snack = state.struct.snack;
      payload.dessert = state.struct.dessert;
      payload.drink = state.struct.drink;
    }

    const hasStruct = payload.main + payload.snack + payload.dessert + payload.drink > 0;

    $("#go").disabled = true;
    $("#result").classList.remove("show");
    setStatus("loading", hasStruct
      ? "正在查真实门店与菜单，并对候选做真实算价…（约 15~40 秒）"
      : "正在查门店与菜单…（约 15~40 秒）");

    const ctrl = new AbortController();
    const timer = setTimeout(function(){ ctrl.abort(); }, 90000);

    try {
      const res = await fetch("/api/plan", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
        signal: ctrl.signal,
      });
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.error || ("请求失败 " + res.status));

      setStatus(null);
      if (data.infeasible) renderInfeasible(data);
      else if (data.mode === "structure") renderStructure(data);
      else renderBudget(data);
    } catch (err) {
      if (err.name === "AbortError") setStatus("error", "请求超时（90 秒）。请稍后重试，或换成到店自取。");
      else setStatus("error", err.message || String(err));
    } finally {
      clearTimeout(timer);
      $("#go").disabled = false;
    }
  }

  $("#go").addEventListener("click", run);
  ["#budget", "#people", "#city", "#keyword", "#avoid"].forEach(function(sel){
    var el = $(sel);
    if (el) el.addEventListener("keydown", function(e){ if (e.key === "Enter") run(); });
  });

  $("#storeRow").style.display = "flex";
})();
</script>
</body>
</html>
